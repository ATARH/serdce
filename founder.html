<title>Обо мне — Школа Мгера Шакаряна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#0B0200;
  --ember:#2B0401; 
  --maroon:#1A0400; 
  --amber:#F2D35E;
  --gold:#F7EA8A;
  --cream:#FFF9C8;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; max-width:100%; overflow-x:hidden;}
body{ background:var(--ink); color:var(--cream); font-family:'PT Serif', Georgia, serif; line-height:1.65; -webkit-font-smoothing:antialiased; min-height:100vh; max-width:100%; overflow-x:hidden; }
a, button, .flip-card, .btn, .premium-card, .status-pill{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important;} }
body::before{ content:""; position:fixed; inset:0; z-index:-2; background: radial-gradient(ellipse 90% 55% at 50% 100%, rgba(43,4,1,.5), transparent 70%), radial-gradient(ellipse 70% 40% at 15% 0%, rgba(26,4,0,.32), transparent 70%), var(--ink); }
body::after{ content:""; position:fixed; inset:0; z-index:-1; opacity:.45; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,.009) 0 1px, transparent 1px 4px); }

h1,h2,h3,.serif-display{font-family:'Playfair Display','PT Serif',serif;}
a{color:inherit;}
.wrap{max-width:1120px; margin:0 auto; padding:0 40px;}
section{padding:100px 0;} section.tight{padding:70px 0;} section + section{border-top:1px solid rgba(247,234,138,.08);}

/* Эффект всплытия при скролле */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out, border-color 0.25s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

header.site-header{ position:sticky; top:0; z-index:50; background:rgba(11,2,0,.35); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid rgba(247,234,138,.1); }
header.site-header.over-video{ background:rgba(11,2,0,.55); }
.nav-inner{ max-width:1120px; margin:0 auto; padding:0 40px; height:76px; display:flex; align-items:center; justify-content:space-between; }
.logo{ font-family:'Playfair Display',serif; font-weight:700; font-size:19px; color:var(--gold); text-decoration:none; letter-spacing:.01em; line-height:1.2; }
.logo small{display:block; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11.5px; color:var(--amber); letter-spacing:.08em; font-weight:400; margin-top:2px;}
nav.menu{display:flex; gap:30px;}
nav.menu a{ font-size:14px; text-decoration:none; color:rgba(255,249,200,.78); position:relative; padding:6px 0; transition:color .2s; }
nav.menu a:hover{color:var(--gold);} nav.menu a.active{color:var(--gold);}
nav.menu a.active::after{ content:""; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:var(--amber); }
.nav-toggle{display:none; background:none; border:none; color:var(--gold); font-size:22px; cursor:pointer; padding:10px; line-height:1;}
.nav-toggle:active{transform:scale(.9);}

.marquee{ overflow:hidden; background:transparent; padding:12px 0; }
.marquee-track{ display:flex; align-items:center; width:max-content; animation:marquee-scroll 28s linear infinite; will-change:transform; }
.marquee:hover .marquee-track{animation-play-state:paused;}
.marquee-track span{ font-family:'Cormorant Garamond',serif; font-style:italic; letter-spacing:.1em; text-transform:uppercase; font-size:13.5px; color:var(--gold); white-space:nowrap; display:flex; align-items:center; gap:34px; padding-right:34px; }
.marquee-track span::after{content:"✦"; color:var(--amber); font-style:normal;}
@keyframes marquee-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
